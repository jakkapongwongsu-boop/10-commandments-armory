<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คลังแสงแก๊ง 10 บัญญัติ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #050505;
    }
    /* ปรับเป็นกระจกใส มองทะลุเห็นภาพพื้นหลังแก๊งชัดเจน */
    .glass-panel {
      background: rgba(10, 10, 14, 0.38);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    .glass-panel-red {
      background: rgba(15, 6, 6, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid rgba(239, 68, 68, 0.75);
      box-shadow: 0 0 25px rgba(220, 38, 38, 0.25), inset 0 0 15px rgba(220, 38, 38, 0.1);
    }
    .glass-item {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .text-glow-red {
      text-shadow: 0 0 20px rgba(239, 68, 68, 0.95), 0 2px 6px rgba(0, 0, 0, 1);
    }
    .text-shadow-hard {
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(185, 28, 28, 0.8);
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-zinc-100 min-h-screen selection:bg-red-800 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DISCORD_CLIENT_ID = "1570162201615011960";
    const REDIRECT_URI = "https://jakkapongwongsu-boop.github.io/10-commandments-armory";

    // ล็อกสิทธิ์แอดมินให้ Discord ของปอนด์คนเดียวเท่านั้น
    const ADMIN_USERS = ["extossakan"];

    const firebaseConfig = {
      databaseURL: "https://gun-tracker-5b087-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const compressImageToBase64 = (file, maxWidth, quality = 0.82) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
        };
      });
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [members, setMembers] = useState([]);
      const [stock, setStock] = useState({ schofield: 17, double: 5 });
      const [logs, setLogs] = useState([]);
      const [stats, setStats] = useState({});
      const [themeImages, setThemeImages] = useState({ logo: '', bg: '' });

      const [isSettingOpen, setIsSettingOpen] = useState(false);
      const [isFullLogOpen, setIsFullLogOpen] = useState(false);
      const [newSStock, setNewSStock] = useState(17);
      const [newDStock, setNewDStock] = useState(5);

      const [logSearch, setLogSearch] = useState('');
      const [logFilterType, setLogFilterType] = useState('all');

      const [nameInput, setNameInput] = useState('');
      const [sCountInput, setSCountInput] = useState(1);
      const [dCountInput, setDCountInput] = useState(0);
      const [copyAlert, setCopyAlert] = useState(false);
      const [uploadingImg, setUploadingImg] = useState(false);

      useEffect(() => {
        const hash = window.location.hash;
        if (hash.includes('access_token')) {
          const params = new URLSearchParams(hash.substring(1));
          const token = params.get('access_token');
          if (token) {
            fetch('https://discord.com/api/users/@me', {
              headers: { authorization: `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(data => {
              if (data.id) {
                const userObj = {
                  id: data.id,
                  rawUsername: data.username,
                  username: data.global_name || data.username,
                  avatar: data.avatar 
                    ? `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png` 
                    : 'https://cdn.discordapp.com/embed/avatars/0.png'
                };
                setCurrentUser(userObj);
                localStorage.setItem('discord_user_10cmd', JSON.stringify(userObj));
                window.history.replaceState(null, null, window.location.pathname);
              }
            });
          }
        } else {
          const savedUser = localStorage.getItem('discord_user_10cmd');
          if (savedUser) {
            try {
              setCurrentUser(JSON.parse(savedUser));
            } catch (e) {
              localStorage.removeItem('discord_user_10cmd');
            }
          }
        }
      }, []);

      useEffect(() => {
        const themeRef = db.ref('theme');
        themeRef.on('value', (snap) => {
          const val = snap.val();
          if (val) setThemeImages({ logo: val.logo || '', bg: val.bg || '' });
        });

        const stockRef = db.ref('stock');
        stockRef.on('value', (snap) => {
          const val = snap.val();
          if (val) {
            setStock({
              schofield: Number(val.schofield) || 17,
              double: Number(val.double) || 5
            });
            setNewSStock(Number(val.schofield) || 17);
            setNewDStock(Number(val.double) || 5);
          } else {
            stockRef.set({ schofield: 17, double: 5 });
          }
        });

        const membersRef = db.ref('members');
        membersRef.on('value', (snap) => {
          const data = snap.val();
          if (data) {
            const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            setMembers(list);
          } else {
            setMembers([]);
          }
        });

        const statsRef = db.ref('stats');
        statsRef.on('value', (snap) => {
          setStats(snap.val() || {});
        });

        const logsRef = db.ref('logs').limitToLast(500);
        logsRef.on('value', (snap) => {
          const data = snap.val();
          if (data) {
            const list = Object.keys(data).map(key => ({ id: key, ...data[key] })).sort((a, b) => b.timestamp - a.timestamp);
            setLogs(list);
          } else {
            setLogs([]);
          }
        });

        return () => {
          themeRef.off();
          stockRef.off();
          membersRef.off();
          logsRef.off();
          statsRef.off();
        };
      }, []);

      const isAdmin = currentUser && (
        ADMIN_USERS.includes((currentUser.username || '').toLowerCase()) ||
        ADMIN_USERS.includes((currentUser.rawUsername || '').toLowerCase()) ||
        ADMIN_USERS.includes(currentUser.id)
      );

      const loginWithDiscord = () => {
        const url = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
        window.location.href = url;
      };

      const logout = () => {
        localStorage.removeItem('discord_user_10cmd');
        setCurrentUser(null);
      };

      const addLog = (text, type = 'info') => {
        const time = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const date = new Date().toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit' });
        db.ref('logs').push({
          text,
          time: `${date} ${time}`,
          type,
          actor: currentUser ? currentUser.username : 'Unknown',
          avatar: currentUser ? currentUser.avatar : '',
          timestamp: Date.now()
        });
      };

      const recordStat = (personName, sCount, dCount) => {
        if (!personName) return;
        const key = personName.trim().toLowerCase().replace(/[.#$/[\]]/g, "_");
        const currentPerson = stats[key] || { name: personName, totalSchofield: 0, totalDouble: 0, totalBorrows: 0 };
        db.ref(`stats/${key}`).set({
          name: personName,
          totalSchofield: (currentPerson.totalSchofield || 0) + sCount,
          totalDouble: (currentPerson.totalDouble || 0) + dCount,
          totalBorrows: (currentPerson.totalBorrows || 0) + (sCount + dCount > 0 ? 1 : 0)
        });
      };

      const handleUploadThemeImage = async (e, type) => {
        if (!isAdmin) return;
        const file = e.target.files[0];
        if (!file) return;
        setUploadingImg(true);
        try {
          const maxWidth = type === 'logo' ? 450 : 1400;
          const base64 = await compressImageToBase64(file, maxWidth, 0.8);
          await db.ref('theme').update({ [type]: base64 });
          addLog(`🖼️ อัปเดตรูปภาพ ${type === 'logo' ? 'โลโก้แก๊ง' : 'พื้นหลังเว็บ'} ฝังลงเซิร์ฟเวอร์แล้ว`, 'setting');
        } catch (err) {
          alert('เกิดข้อผิดพลาดในการฝังรูป');
        }
        setUploadingImg(false);
      };

      const totalSUsed = members.reduce((sum, m) => sum + (Number(m.schofield) || 0), 0);
      const totalDUsed = members.reduce((sum, m) => sum + (Number(m.double) || 0), 0);
      const sRemain = stock.schofield - totalSUsed;
      const dRemain = stock.double - totalDUsed;

      const handleAddMember = (e) => {
        e.preventDefault();
        const trimmed = nameInput.trim();
        if (!trimmed) return;
        if (sCountInput > sRemain || dCountInput > dRemain) {
          alert('จำนวนปืนที่เบิกเกินยอดที่มีอยู่ในคลัง!');
          return;
        }

        const existing = members.find(m => m.name.toLowerCase() === trimmed.toLowerCase());
        if (existing) {
          db.ref(`members/${existing.id}`).update({
            schofield: (Number(existing.schofield) || 0) + sCountInput,
            double: (Number(existing.double) || 0) + dCountInput,
            time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
          });
          addLog(`เพิ่มปืนให้ "${trimmed}" (+สกอฟิล ${sCountInput}, +ดับเบิ้ล ${dCountInput})`, 'add');
        } else {
          db.ref('members').push({
            name: trimmed,
            schofield: sCountInput,
            double: dCountInput,
            time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
          });
          addLog(`เบิกปืนให้ "${trimmed}" (สกอฟิล ${sCountInput}, ดับเบิ้ล ${dCountInput})`, 'add');
        }

        recordStat(trimmed, sCountInput, dCountInput);
        setNameInput('');
        setSCountInput(1);
        setDCountInput(0);
      };

      const updateGun = (id, type, delta) => {
        const target = members.find(m => m.id === id);
        if (!target) return;
        const current = Number(target[type]) || 0;
        if (delta > 0) {
          if (type === 'schofield' && sRemain <= 0) return;
          if (type === 'double' && dRemain <= 0) return;
        }
        const next = Math.max(0, current + delta);
        db.ref(`members/${id}`).update({ [type]: next });

        const gunName = type === 'schofield' ? 'สกอฟิล' : 'ดับเบิ้ล';
        addLog(`ปรับ ${gunName} ของ "${target.name}" เป็น ${next} (${delta > 0 ? '+1 เบิกเพิ่ม' : '-1 คืนคลัง'})`, delta > 0 ? 'add' : 'return');
        if (delta > 0) {
          recordStat(target.name, type === 'schofield' ? 1 : 0, type === 'double' ? 1 : 0);
        }
      };

      const removeMember = (id) => {
        const target = members.find(m => m.id === id);
        if (!target) return;

        const confirmDelete = window.confirm(`ยืนยันลบ "${target.name}" ออกจากระบบ? (ประวัติจะบันทึกชื่อ Discord ทันที)`);
        if (!confirmDelete) return;

        const gunDetails = `(ตอนลบถือ: สกอฟิล ${target.schofield || 0}, ดับเบิ้ล ${target.double || 0})`;
        addLog(`🚨 ได้ลบ "${target.name}" ออกจากระบบ! ${gunDetails}`, 'delete');
        db.ref(`members/${id}`).remove();
      };

      const handleSaveStock = (e) => {
        e.preventDefault();
        if (!isAdmin) return;
        db.ref('stock').set({
          schofield: Number(newSStock) || 0,
          double: Number(newDStock) || 0
        });
        addLog(`⚙️ ปรับยอดคลังสูงสุดเป็น สกอฟิล ${newSStock}, ดับเบิ้ล ${newDStock}`, 'setting');
        setIsSettingOpen(false);
      };

      const copySummary = () => {
        let text = `📜 คลังแสงแก๊ง 10 บัญญัติ\n`;
        text += `🔫 สกอฟิล: เหลือ ${sRemain}/${stock.schofield}\n`;
        text += `💥 ดับเบิ้ล: เหลือ ${dRemain}/${stock.double}\n\n`;
        text += `📋 รายชื่อสมาชิกที่ถือปืน:\n`;
        const activeHolders = members.filter(m => (m.schofield || 0) > 0 || (m.double || 0) > 0);
        if (activeHolders.length === 0) {
          text += `- คลังครบ ปืนอยู่ในตู้ทั้งหมด\n`;
        } else {
          activeHolders.forEach(m => {
            const guns = [];
            if (m.schofield > 0) guns.push(`สกอฟิล ${m.schofield}`);
            if (m.double > 0) guns.push(`ดับเบิ้ล ${m.double}`);
            text += `• ${m.name}: ${guns.join(', ')}\n`;
          });
        }
        navigator.clipboard.writeText(text);
        setCopyAlert(true);
        setTimeout(() => setCopyAlert(false), 2000);
      };

      // ปรับฟิลเตอร์พื้นหลังให้สว่างและเห็นภาพแก๊งด้านหลังชัดเจนขึ้น
      const bgStyle = themeImages.bg
        ? {
            backgroundImage: `linear-gradient(to right, rgba(5, 5, 5, 0.25) 0%, rgba(10, 5, 5, 0.55) 55%, rgba(5, 5, 5, 0.72) 100%), url(${themeImages.bg})`,
            backgroundSize: 'cover',
            backgroundPosition: 'center top',
            backgroundAttachment: 'fixed'
          }
        : {
            backgroundImage: `radial-gradient(circle at 30% 20%, rgba(120, 15, 15, 0.35), rgba(5, 5, 5, 0.98))`
          };

      if (!currentUser) {
        return (
          <div style={bgStyle} className="min-h-screen flex items-center justify-center p-4">
            <div className="glass-panel-red p-8 rounded-3xl max-w-md w-full text-center space-y-6">
              {themeImages.logo ? (
                <img src={themeImages.logo} alt="10 บัญญัติ" className="w-36 h-36 mx-auto rounded-full object-cover border-2 border-zinc-300 shadow-[0_0_30px_rgba(220,38,38,0.7)]" />
              ) : (
                <div className="w-24 h-24 mx-auto rounded-full bg-red-950/60 border-2 border-red-600 flex items-center justify-center text-4xl shadow-[0_0_30px_rgba(220,38,38,0.6)]">
                  📜
                </div>
              )}
              <div>
                <h1 className="text-4xl font-extrabold text-red-500 text-glow-red tracking-wide">แก๊ง 10 บัญญัติ</h1>
                <p className="text-xs text-zinc-200 mt-2 tracking-widest uppercase text-shadow-hard">THE 10 COMMANDMENTS • คลังแสงอาวุธแก๊ง</p>
                <p className="text-xs text-zinc-300 mt-4 text-shadow-hard">กรุณายืนยันตัวตนผ่าน Discord ก่อนเบิกหรือตรวจสอบคลัง</p>
              </div>
              <button
                onClick={loginWithDiscord}
                className="w-full flex items-center justify-center gap-3 bg-[#5865F2] hover:bg-[#4752C4] text-white font-bold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg"
              >
                เข้าสู่ระบบด้วย Discord
              </button>
            </div>
          </div>
        );
      }

      const leaderboardData = Object.values(stats).sort((a, b) => {
        const totalA = (a.totalSchofield || 0) + (a.totalDouble || 0);
        const totalB = (b.totalSchofield || 0) + (b.totalDouble || 0);
        return totalB - totalA;
      });

      const filteredLogs = logs.filter(log => {
        const matchesType = logFilterType === 'all' || log.type === logFilterType;
        const matchesSearch = !logSearch.trim() || 
          (log.text && log.text.toLowerCase().includes(logSearch.toLowerCase())) ||
          (log.actor && log.actor.toLowerCase().includes(logSearch.toLowerCase()));
        return matchesType && matchesSearch;
      });

      return (
        <div style={bgStyle} className="min-h-screen p-4 sm:p-6 lg:p-8">
          <div className="max-w-7xl mx-auto space-y-6">
            
            {isAdmin && (!themeImages.logo || !themeImages.bg) && (
              <div className="bg-amber-950/80 backdrop-blur-md border border-amber-500 p-3 rounded-xl flex flex-wrap items-center justify-between gap-2 text-xs">
                <span>💡 <b>สิทธิ์แอดมิน (ปอนด์):</b> กดปุ่ม <b>"⚙️ ตั้งค่าคลังสีเข้ม"</b> เพื่อเลือกไฟล์รูปโลโก้และพื้นหลังฝังลงเซิร์ฟเวอร์ให้ทุกคนเห็นได้เลย</span>
                <button onClick={() => setIsSettingOpen(true)} className="bg-amber-500 text-black font-bold px-3 py-1 rounded-lg">กดฝังรูปตรงนี้</button>
              </div>
            )}

            {/* HEADER */}
            <header className="flex flex-col lg:flex-row justify-between items-center gap-6 pb-2">
              <div className="flex flex-col sm:flex-row items-center gap-5 text-center sm:text-left">
                {themeImages.logo ? (
                  <img 
                    src={themeImages.logo} 
                    alt="โลโก้ 10 บัญญัติ" 
                    className="w-28 h-28 sm:w-36 sm:h-36 rounded-full object-cover border-2 border-zinc-300/80 shadow-[0_0_35px_rgba(0,0,0,0.9)] shrink-0"
                  />
                ) : (
                  <div 
                    onClick={() => isAdmin && setIsSettingOpen(true)}
                    className={`w-28 h-28 sm:w-36 sm:h-36 rounded-full bg-black/40 backdrop-blur border-2 border-red-500/60 flex flex-col items-center justify-center text-center p-2 shrink-0 ${isAdmin ? 'border-dashed cursor-pointer hover:border-red-400' : ''}`}
                  >
                    <span className="text-3xl">📜</span>
                    {isAdmin && <span className="text-[10px] text-zinc-300 mt-1">คลิกเพื่อฝังโลโก้</span>}
                  </div>
                )}
                <div>
                  <h1 className="text-4xl sm:text-5xl font-extrabold text-red-500 text-glow-red tracking-tight">
                    แก๊ง 10 บัญญัติ
                  </h1>
                  <p className="text-sm sm:text-base text-zinc-100 font-medium tracking-wider mt-1 text-shadow-hard">
                    THE 10 COMMANDMENTS • คลังแสงอาวุธแก๊ง
                  </p>
                </div>
              </div>

              {/* ปุ่มควบคุมมุมขวาบน */}
              <div className="flex flex-wrap items-center justify-center gap-2.5">
                <div className="glass-panel px-3.5 py-2 rounded-xl flex items-center gap-2.5">
                  <img src={currentUser.avatar} alt="avatar" className="w-6 h-6 rounded-full border border-indigo-400" />
                  <span className="text-xs font-semibold text-white text-shadow-hard">{currentUser.username}</span>
                  {isAdmin && <span className="text-[10px] bg-red-800/80 text-red-100 px-1.5 py-0.5 rounded border border-red-400/50">ADMIN</span>}
                  <button onClick={logout} className="text-xs text-red-300 hover:text-red-200 ml-1 font-semibold">ออก</button>
                </div>

                {isAdmin && (
                  <button
                    onClick={() => setIsSettingOpen(true)}
                    className="glass-panel hover:bg-white/10 text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 border border-amber-400/50 text-shadow-hard"
                  >
                    ⚙️ ตั้งค่าคลังสีเข้ม
                  </button>
                )}

                <button
                  onClick={copySummary}
                  className="bg-red-700/90 hover:bg-red-600 text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow-[0_0_20px_rgba(220,38,38,0.6)] border border-red-400/60"
                >
                  {copyAlert ? '✓ คัดลอกสำเร็จ!' : '📋 คัดลอกสรุป'}
                </button>
              </div>
            </header>

            {/* MAIN GRID LAYOUT */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              
              <div className="hidden lg:block lg:col-span-3"></div>

              {/* คอลัมน์กลาง: ยอดปืน + ฟอร์มเบิกและรายชื่อ (กระจกใสโปร่งแสง) */}
              <div className="lg:col-span-5 space-y-5">
                <div className="grid grid-cols-2 gap-4">
                  <div className="glass-panel p-4 rounded-2xl text-center">
                    <div className="text-xs sm:text-sm text-zinc-100 font-semibold text-shadow-hard">สกอฟิล (Schofield)</div>
                    <div className="text-4xl sm:text-5xl font-extrabold text-white mt-2 text-shadow-hard">
                      {sRemain} <span className="text-xs font-normal text-zinc-300">/ {stock.schofield}</span>
                    </div>
                  </div>
                  <div className="glass-panel p-4 rounded-2xl text-center">
                    <div className="text-xs sm:text-sm text-zinc-100 font-semibold text-shadow-hard">ดับเบิ้ล (Double-Action)</div>
                    <div className="text-4xl sm:text-5xl font-extrabold text-white mt-2 text-shadow-hard">
                      {dRemain} <span className="text-xs font-normal text-zinc-300">/ {stock.double}</span>
                    </div>
                  </div>
                </div>

                <div className="glass-panel-red p-5 rounded-2xl space-y-5">
                  <form onSubmit={handleAddMember} className="space-y-3">
                    <h2 className="text-base font-bold text-white text-shadow-hard">ฟอร์มกรอกบันทึกเบิกอาวุธ</h2>
                    <div className="text-xs text-zinc-200 text-shadow-hard">เบิกอาวุธ</div>
                    <input
                      type="text"
                      placeholder="พิมพ์ชื่อคนเบิกอาวุธ..."
                      value={nameInput}
                      onChange={e => setNameInput(e.target.value)}
                      className="w-full bg-black/45 border border-white/20 focus:border-red-500 px-3.5 py-2.5 rounded-xl text-sm text-white placeholder-zinc-400 outline-none transition"
                    />
                    <div className="grid grid-cols-2 gap-3 pt-1">
                      <div className="flex items-center justify-between bg-black/45 border border-white/20 px-3 py-2 rounded-xl">
                        <span className="text-xs text-amber-300 font-semibold text-shadow-hard">สกอฟิล:</span>
                        <input
                          type="number"
                          min="0"
                          max={sRemain}
                          value={sCountInput}
                          onChange={e => setSCountInput(Math.max(0, parseInt(e.target.value) || 0))}
                          className="w-12 bg-transparent text-right font-bold text-white outline-none"
                        />
                      </div>
                      <div className="flex items-center justify-between bg-black/45 border border-white/20 px-3 py-2 rounded-xl">
                        <span className="text-xs text-red-300 font-semibold text-shadow-hard">ดับเบิ้ล:</span>
                        <input
                          type="number"
                          min="0"
                          max={dRemain}
                          value={dCountInput}
                          onChange={e => setDCountInput(Math.max(0, parseInt(e.target.value) || 0))}
                          className="w-12 bg-transparent text-right font-bold text-white outline-none"
                        />
                      </div>
                    </div>
                    <button
                      type="submit"
                      className="w-full bg-red-700/90 hover:bg-red-600 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-[0_0_15px_rgba(220,38,38,0.5)] border border-red-400/40"
                    >
                      + บันทึกเบิกอาวุธ
                    </button>
                  </form>

                  <div className="border-t border-white/15 pt-4 space-y-3">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-bold text-white text-shadow-hard">รายชื่อสมาชิกแก๊งที่ถือปืน ({members.length} คน)</span>
                    </div>

                    {members.length === 0 ? (
                      <div className="p-6 text-center text-zinc-300 text-xs text-shadow-hard">ยังไม่มีใครถือปืน อาวุธครบอยู่ในคลัง</div>
                    ) : (
                      <div className="space-y-2.5 max-h-80 overflow-y-auto pr-1">
                        {members.map(m => (
                          <div key={m.id} className="glass-item p-3 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div>
                              <div className="font-bold text-white text-sm text-shadow-hard">{m.name}</div>
                              <div className="text-[11px] text-zinc-300 text-shadow-hard">เบิกเมื่อ {m.time} น.</div>
                            </div>

                            <div className="flex items-center gap-2 self-end sm:self-center">
                              <div className="flex items-center gap-1 bg-black/45 border border-white/15 px-2 py-1 rounded-lg">
                                <span className="text-[11px] text-amber-300 mr-1 font-medium">สกอฟิล</span>
                                <button onClick={() => updateGun(m.id, 'schofield', -1)} className="w-5 h-5 rounded bg-white/10 hover:bg-white/20 text-xs font-bold">-</button>
                                <span className="w-5 text-center text-xs font-bold text-white">{m.schofield || 0}</span>
                                <button onClick={() => updateGun(m.id, 'schofield', 1)} disabled={sRemain <= 0} className="w-5 h-5 rounded bg-white/10 hover:bg-white/20 disabled:opacity-30 text-xs font-bold">+</button>
                              </div>

                              <div className="flex items-center gap-1 bg-black/45 border border-white/15 px-2 py-1 rounded-lg">
                                <span className="text-[11px] text-red-300 mr-1 font-medium">ดับเบิ้ล</span>
                                <button onClick={() => updateGun(m.id, 'double', -1)} className="w-5 h-5 rounded bg-white/10 hover:bg-white/20 text-xs font-bold">-</button>
                                <span className="w-5 text-center text-xs font-bold text-white">{m.double || 0}</span>
                                <button onClick={() => updateGun(m.id, 'double', 1)} disabled={dRemain <= 0} className="w-5 h-5 rounded bg-white/10 hover:bg-white/20 disabled:opacity-30 text-xs font-bold">+</button>
                              </div>

                              <button
                                onClick={() => removeMember(m.id)}
                                className="bg-red-600/90 hover:bg-red-500 text-white p-1.5 rounded-lg text-xs transition shadow"
                                title="ลบรายการ"
                              >
                                🗑️
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>

              {/* คอลัมน์ขวา: อันดับมือปืนแก๊ง + บันทึกกิจกรรมสด (กระจกใสโปร่งแสง) */}
              <div className="lg:col-span-4 space-y-5">
                
                <div className="glass-panel p-5 rounded-2xl space-y-3">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2 border-b border-white/15 pb-2.5 text-shadow-hard">
                    🏆 อันดับมือปืนแก๊ง (Leaderboard)
                  </h3>
                  {leaderboardData.length === 0 ? (
                    <div className="p-4 text-center text-zinc-300 text-xs text-shadow-hard">ยังไม่มีสถิติการเบิกปืน</div>
                  ) : (
                    <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
                      {leaderboardData.slice(0, 6).map((item, idx) => {
                        const total = (item.totalSchofield || 0) + (item.totalDouble || 0);
                        const medal = idx === 0 ? '🏆' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}`;
                        return (
                          <div key={idx} className="flex items-center justify-between text-xs py-1.5 px-2.5 rounded-lg hover:bg-white/10 transition">
                            <div className="flex items-center gap-2.5">
                              <span className="w-5 text-center font-bold text-amber-300 text-shadow-hard">{medal}</span>
                              <span className="font-semibold text-white text-shadow-hard">{item.name}</span>
                            </div>
                            <div className="text-zinc-200 text-shadow-hard">
                              สกอฟิล {item.totalSchofield || 0} • ดับเบิ้ล {item.totalDouble || 0} <span className="text-amber-300 font-bold ml-1">({total})</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>

                <div className="glass-panel p-5 rounded-2xl space-y-3">
                  <div className="flex items-center justify-between border-b border-white/15 pb-2.5">
                    <h3 className="text-sm font-bold text-white flex items-center gap-2 text-shadow-hard">
                      📜 บันทึกกิจกรรมสด 
                    </h3>
                    <button
                      onClick={() => setIsFullLogOpen(true)}
                      className="bg-red-700/85 hover:bg-red-600 text-white text-[11px] font-bold px-2.5 py-1 rounded-lg border border-red-400/50 transition"
                    >
                      🔍 เช็ค Log ย้อนหลัง ({logs.length})
                    </button>
                  </div>

                  {logs.length === 0 ? (
                    <div className="p-4 text-center text-zinc-300 text-xs text-shadow-hard">ยังไม่มีประวัติกิจกรรม</div>
                  ) : (
                    <div className="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                      {logs.slice(0, 8).map(log => (
                        <div key={log.id} className="glass-item flex items-center justify-between gap-2 p-2.5 rounded-xl text-xs">
                          <div className="flex items-center gap-2.5 overflow-hidden">
                            {log.avatar ? (
                              <img src={log.avatar} alt="" className="w-7 h-7 rounded-full shrink-0 border border-indigo-400/60" />
                            ) : (
                              <div className="w-7 h-7 rounded-full bg-indigo-600 shrink-0 flex items-center justify-center text-[10px]">👤</div>
                            )}
                            <div className="overflow-hidden">
                              <div className={`font-semibold truncate text-shadow-hard ${log.type === 'delete' ? 'text-red-300' : 'text-white'}`}>
                                <span className="text-amber-300">[{log.actor}]</span> {log.text}
                              </div>
                              <div className="text-[10px] text-zinc-300">{log.time}</div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  <button
                    onClick={() => setIsFullLogOpen(true)}
                    className="w-full bg-black/45 hover:bg-white/10 text-zinc-100 text-xs font-semibold py-2 rounded-xl border border-white/20 transition text-shadow-hard"
                  >
                    📂 เปิดหน้าต่างไล่ดูประวัติ Log เก่าๆ ทั้งหมด
                  </button>
                </div>

              </div>
            </div>
          </div>

          {/* MODAL 1: หน้าต่างเช็คประวัติ Log ย้อนหลังทั้งหมด */}
          {isFullLogOpen && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="glass-panel-red bg-zinc-950/85 rounded-3xl max-w-3xl w-full p-6 space-y-4 max-h-[90vh] flex flex-col">
                <div className="flex justify-between items-center border-b border-white/15 pb-3">
                  <div>
                    <h3 className="font-bold text-lg text-red-400 flex items-center gap-2">
                      📜 ประวัติ Log ย้อนหลังทั้งหมด ({filteredLogs.length} รายการ)
                    </h3>
                    <p className="text-xs text-zinc-300">ค้นหาชื่อคนเบิก คนกดลบ หรือเลือกดูเฉพาะรายการที่ต้องการ</p>
                  </div>
                  <button onClick={() => setIsFullLogOpen(false)} className="text-zinc-300 hover:text-white text-xl font-bold px-2">✕</button>
                </div>

                <div className="flex flex-col sm:flex-row gap-2">
                  <input
                    type="text"
                    placeholder="🔍 พิมพ์ค้นหาชื่อคนเบิก, ชื่อ Discord หรือเวลา..."
                    value={logSearch}
                    onChange={e => setLogSearch(e.target.value)}
                    className="flex-1 bg-black/60 border border-white/20 focus:border-red-500 px-3.5 py-2 rounded-xl text-xs text-white outline-none"
                  />
                  <div className="flex gap-1.5">
                    <button
                      onClick={() => setLogFilterType('all')}
                      className={`px-3 py-2 rounded-xl text-xs font-bold ${logFilterType === 'all' ? 'bg-red-700 text-white' : 'bg-white/10 text-zinc-300'}`}
                    >ทั้งหมด</button>
                    <button
                      onClick={() => setLogFilterType('add')}
                      className={`px-3 py-2 rounded-xl text-xs font-bold ${logFilterType === 'add' ? 'bg-emerald-700 text-white' : 'bg-white/10 text-zinc-300'}`}
                    >เบิกปืน</button>
                    <button
                      onClick={() => setLogFilterType('return')}
                      className={`px-3 py-2 rounded-xl text-xs font-bold ${logFilterType === 'return' ? 'bg-amber-700 text-white' : 'bg-white/10 text-zinc-300'}`}
                    >คืนปืน</button>
                    <button
                      onClick={() => setLogFilterType('delete')}
                      className={`px-3 py-2 rounded-xl text-xs font-bold ${logFilterType === 'delete' ? 'bg-rose-700 text-white' : 'bg-white/10 text-zinc-300'}`}
                    >🚨 ลบข้อมูล</button>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                  {filteredLogs.length === 0 ? (
                    <div className="p-10 text-center text-zinc-400 text-sm">ไม่พบรายการที่ค้นหา</div>
                  ) : (
                    filteredLogs.map(log => {
                      let borderStyle = "border-white/15 bg-black/45";
                      if (log.type === 'delete') borderStyle = "border-red-500/80 bg-red-950/45";
                      if (log.type === 'add') borderStyle = "border-emerald-700/60 bg-emerald-950/30";
                      if (log.type === 'return') borderStyle = "border-amber-700/60 bg-amber-950/30";

                      return (
                        <div key={log.id} className={`p-3 rounded-xl border flex items-center justify-between gap-3 text-xs ${borderStyle}`}>
                          <div className="flex items-center gap-3">
                            {log.avatar ? (
                              <img src={log.avatar} alt="" className="w-7 h-7 rounded-full shrink-0 border border-red-500/50" />
                            ) : (
                              <div className="w-7 h-7 rounded-full bg-zinc-700 shrink-0"></div>
                            )}
                            <div>
                              <span className="font-bold text-amber-300 mr-2">[{log.actor}]</span>
                              <span className={log.type === 'delete' ? 'text-red-300 font-bold' : 'text-zinc-100'}>{log.text}</span>
                            </div>
                          </div>
                          <span className="text-[11px] text-zinc-300 shrink-0 font-mono">{log.time}</span>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL 2: ตั้งค่าคลังปืน & ฝังรูปลงเซิร์ฟเวอร์ (เฉพาะปอนด์คนเดียวที่เปิดได้) */}
          {isAdmin && isSettingOpen && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="glass-panel-red bg-zinc-950/90 rounded-3xl max-w-md w-full p-6 space-y-5">
                <div className="flex justify-between items-center border-b border-white/15 pb-3">
                  <h3 className="font-bold text-base text-red-400">⚙️ ตั้งค่าคลัง & ฝังรูปลงเซิร์ฟเวอร์ (เฉพาะแอดมิน)</h3>
                  <button onClick={() => setIsSettingOpen(false)} className="text-zinc-300 hover:text-white">✕</button>
                </div>

                <div className="space-y-3 bg-black/50 p-4 rounded-2xl border border-white/15">
                  <div className="text-xs font-bold text-amber-400">🖼️ ฝังรูปลงเว็บถาวร (เลือกไฟล์ครั้งเดียว ทุกคนเห็นเหมือนกันหมด)</div>
                  {uploadingImg && <div className="text-xs text-emerald-400 animate-pulse">กำลังฝังรูปลงเซิร์ฟเวอร์...</div>}
                  <div>
                    <label className="text-xs text-zinc-200 block mb-1">1. รูปโลโก้แก๊ง 10 บัญญัติ (วงกลมซ้ายบน):</label>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={(e) => handleUploadThemeImage(e, 'logo')}
                      className="w-full text-xs text-zinc-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-red-700 file:text-white hover:file:bg-red-600"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-zinc-200 block mb-1">2. รูปพื้นหลังแก๊งพระจันทร์สีเลือด:</label>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={(e) => handleUploadThemeImage(e, 'bg')}
                      className="w-full text-xs text-zinc-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-red-700 file:text-white hover:file:bg-red-600"
                    />
                  </div>
                </div>

                <form onSubmit={handleSaveStock} className="space-y-3">
                  <div className="text-xs font-bold text-zinc-200">🔫 ปรับจำนวนปืนสูงสุดในคลัง</div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs text-zinc-300 block mb-1">สกอฟิลทั้งหมด:</label>
                      <input
                        type="number"
                        min="1"
                        value={newSStock}
                        onChange={e => setNewSStock(e.target.value)}
                        className="w-full bg-black/60 border border-white/20 px-3 py-2 rounded-xl text-amber-400 font-bold outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-zinc-300 block mb-1">ดับเบิ้ลทั้งหมด:</label>
                      <input
                        type="number"
                        min="1"
                        value={newDStock}
                        onChange={e => setNewDStock(e.target.value)}
                        className="w-full bg-black/60 border border-white/20 px-3 py-2 rounded-xl text-red-400 font-bold outline-none"
                      />
                    </div>
                  </div>
                  <div className="flex gap-2 justify-end pt-2">
                    <button
                      type="button"
                      onClick={() => setIsSettingOpen(false)}
                      className="px-4 py-2 rounded-xl text-xs text-zinc-300 hover:text-white"
                    >
                      ปิดหน้าต่าง
                    </button>
                    <button
                      type="submit"
                      className="bg-red-700 hover:bg-red-600 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-lg"
                    >
                      บันทึกยอดคลัง
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
