<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คลังแสงแก๊ง 10 บัญญัติ</title>
  
  <!-- CSS สำรองตัวที่ 1: Cloudflare Tailwind (เสถียรและไม่โดนบล็อกง่าย) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <!-- CSS ตัวหลัก: Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* CSS พื้นฐานฝังในตัวเว็บ (ป้องกันหน้าพัง 100% แม้ CDN โดนบล็อก) */
    * { box-sizing: border-box; }
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #050505 !important;
      color: #f4f4f5 !important;
      margin: 0;
      padding: 0;
    }
    input, button {
      font-family: 'Kanit', sans-serif;
      color: #ffffff;
    }
    input {
      background-color: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 0.75rem;
      padding: 0.5rem 0.85rem;
    }
    button {
      cursor: pointer;
      border-radius: 0.75rem;
    }
    .glass-panel {
      background: rgba(12, 12, 16, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.55);
      border-radius: 1rem;
    }
    .glass-panel-red {
      background: rgba(18, 7, 9, 0.62);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(239, 68, 68, 0.65);
      border-top: 1.5px solid rgba(248, 113, 113, 0.85);
      box-shadow: 0 0 30px rgba(220, 38, 38, 0.22), inset 0 0 20px rgba(220, 38, 38, 0.08);
      border-radius: 1rem;
    }
    .glass-item {
      background: rgba(0, 0, 0, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0.75rem;
      transition: all 0.2s ease;
    }
    .glass-item:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(239, 68, 68, 0.45);
    }
    .text-glow-red {
      text-shadow: 0 0 22px rgba(239, 68, 68, 0.95), 0 2px 6px rgba(0, 0, 0, 1);
    }
    .text-shadow-hard {
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.35);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(185, 28, 28, 0.85);
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-zinc-100 min-h-screen selection:bg-red-800 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DISCORD_CLIENT_ID = "1570162201615011960";
    const REDIRECT_URI = "https://jakkapongwongsu-boop.github.io/10-commandments-armory";

    const ADMIN_USERS = ["extossakan"];

    const firebaseConfig = {
      databaseURL: "https://gun-tracker-5b087-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const compressImageToBase64 = (file, maxWidth, quality = 0.82) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
        };
      });
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [members, setMembers] = useState([]);
      const [stock, setStock] = useState({ schofield: 17, double: 5 });
      const [logs, setLogs] = useState([]);
      const [stats, setStats] = useState({});
      const [themeImages, setThemeImages] = useState({ logo: '', bg: '', webhookUrl: '' });

      const [isSettingOpen, setIsSettingOpen] = useState(false);
      const [isFullLogOpen, setIsFullLogOpen] = useState(false);
      const [newSStock, setNewSStock] = useState(17);
      const [newDStock, setNewDStock] = useState(5);
      const [webhookInput, setWebhookInput] = useState('');

      const [memberSearch, setMemberSearch] = useState('');
      const [logSearch, setLogSearch] = useState('');
      const [logFilterType, setLogFilterType] = useState('all');

      const [nameInput, setNameInput] = useState('');
      const [sCountInput, setSCountInput] = useState(1);
      const [dCountInput, setDCountInput] = useState(0);
      const [copyAlert, setCopyAlert] = useState(false);
      const [uploadingImg, setUploadingImg] = useState(false);

      useEffect(() => {
        const hash = window.location.hash;
        if (hash.includes('access_token')) {
          const params = new URLSearchParams(hash.substring(1));
          const token = params.get('access_token');
          if (token) {
            fetch('https://discord.com/api/users/@me', {
              headers: { authorization: `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(data => {
              if (data.id) {
                const userObj = {
                  id: data.id,
                  rawUsername: data.username,
                  username: data.global_name || data.username,
                  avatar: data.avatar 
                    ? `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png` 
                    : 'https://cdn.discordapp.com/embed/avatars/0.png'
                };
                setCurrentUser(userObj);
                localStorage.setItem('discord_user_10cmd', JSON.stringify(userObj));
                window.history.replaceState(null, null, window.location.pathname);
              }
            });
          }
        } else {
          const savedUser = localStorage.getItem('discord_user_10cmd');
          if (savedUser) {
            try {
              setCurrentUser(JSON.parse(savedUser));
            } catch (e) {
              localStorage.removeItem('discord_user_10cmd');
            }
          }
        }
      }, []);

      useEffect(() => {
        const themeRef = db.ref('theme');
        themeRef.on('value', (snap) => {
          const val = snap.val();
          if (val) {
            setThemeImages({
              logo: val.logo || '',
              bg: val.bg || '',
              webhookUrl: val.webhookUrl || ''
            });
            setWebhookInput(val.webhookUrl || '');
          }
        });

        const stockRef = db.ref('stock');
        stockRef.on('value', (snap) => {
          const val = snap.val();
          if (val) {
            setStock({
              schofield: Number(val.schofield) || 17,
              double: Number(val.double) || 5
            });
            setNewSStock(Number(val.schofield) || 17);
            setNewDStock(Number(val.double) || 5);
          } else {
            stockRef.set({ schofield: 17, double: 5 });
          }
        });

        const membersRef = db.ref('members');
        membersRef.on('value', (snap) => {
          const data = snap.val();
          if (data) {
            const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            setMembers(list);
          } else {
            setMembers([]);
          }
        });

        const statsRef = db.ref('stats');
        statsRef.on('value', (snap) => {
          setStats(snap.val() || {});
        });

        const logsRef = db.ref('logs').limitToLast(500);
        logsRef.on('value', (snap) => {
          const data = snap.val();
          if (data) {
            const list = Object.keys(data).map(key => ({ id: key, ...data[key] })).sort((a, b) => b.timestamp - a.timestamp);
            setLogs(list);
          } else {
            setLogs([]);
          }
        });

        return () => {
          themeRef.off();
          stockRef.off();
          membersRef.off();
          logsRef.off();
          statsRef.off();
        };
      }, []);

      const isAdmin = currentUser && (
        ADMIN_USERS.includes((currentUser.username || '').toLowerCase()) ||
        ADMIN_USERS.includes((currentUser.rawUsername || '').toLowerCase()) ||
        ADMIN_USERS.includes(currentUser.id)
      );

      const loginWithDiscord = () => {
        const url = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
        window.location.href = url;
      };

      const logout = () => {
        localStorage.removeItem('discord_user_10cmd');
        setCurrentUser(null);
      };

      // ฟังก์ชันยิงแจ้งเตือนเข้า Discord Webhook
      const sendDiscordWebhook = (text, type, nextSRemain, nextDRemain) => {
        if (!themeImages.webhookUrl || !themeImages.webhookUrl.startsWith('https://discord.com/api/webhooks/')) return;
        
        let color = 3447003; // น้ำเงิน
        let title = "📜 อัปเดตคลังแสง 10 บัญญัติ";
        if (type === 'add') { color = 3066993; title = "🟢 มีการเบิกอาวุธออกจากคลัง"; }
        if (type === 'return') { color = 15105570; title = "🟠 มีการคืนอาวุธเข้าคลัง"; }
        if (type === 'delete') { color = 15158332; title = "🚨 แจ้งเตือนการลบรายชื่อคนถือปืน!"; }
        if (type === 'setting') { color = 10181046; title = "⚙️ แอดมินปรับปรุงการตั้งค่าคลัง"; }

        const payload = {
          username: "คลังแสง 10 บัญญัติ",
          avatar_url: currentUser && currentUser.avatar ? currentUser.avatar : undefined,
          embeds: [{
            title: title,
            description: `**ผู้ทำรายการ (Discord):** \`${currentUser ? currentUser.username : 'Unknown'}\`\n**รายละเอียด:** ${text}`,
            color: color,
            fields: [
              { name: "🔫 สกอฟิลคงเหลือ", value: `${nextSRemain} / ${stock.schofield} กระบอก`, inline: true },
              { name: "💥 ดับเบิ้ลคงเหลือ", value: `${nextDRemain} / ${stock.double} กระบอก`, inline: true }
            ],
            footer: { text: `เวลาทำรายการ: ${new Date().toLocaleString('th-TH')}` }
          }]
        };

        fetch(themeImages.webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(() => {});
      };

      const totalSUsed = members.reduce((sum, m) => sum + (Number(m.schofield) || 0), 0);
      const totalDUsed = members.reduce((sum, m) => sum + (Number(m.double) || 0), 0);
      const sRemain = Math.max(0, stock.schofield - totalSUsed);
      const dRemain = Math.max(0, stock.double - totalDUsed);

      const addLog = (text, type = 'info', customSRemain = sRemain, customDRemain = dRemain) => {
        const time = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const date = new Date().toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit' });
        db.ref('logs').push({
          text,
          time: `${date} ${time}`,
          type,
          actor: currentUser ? currentUser.username : 'Unknown',
          avatar: currentUser ? currentUser.avatar : '',
          timestamp: Date.now()
        });
        sendDiscordWebhook(text, type, customSRemain, customDRemain);
      };

      const recordStat = (personName, sCount, dCount) => {
        if (!personName) return;
        const key = personName.trim().toLowerCase().replace(/[.#$/[\]]/g, "_");
        const currentPerson = stats[key] || { name: personName, totalSchofield: 0, totalDouble: 0, totalBorrows: 0 };
        db.ref(`stats/${key}`).set({
          name: personName,
          totalSchofield: (currentPerson.totalSchofield || 0) + sCount,
          totalDouble: (currentPerson.totalDouble || 0) + dCount,
          totalBorrows: (currentPerson.totalBorrows || 0) + (sCount + dCount > 0 ? 1 : 0)
        });
      };

      const handleResetLeaderboard = () => {
        if (!isAdmin) return;
        const confirmReset = window.confirm('⚠️ ยืนยันการล้างสถิติ "อันดับมือปืนแก๊ง (Leaderboard)" ทั้งหมดเพื่อเริ่มนับซีซั่นใหม่หรือไม่?');
        if (!confirmReset) return;
        db.ref('stats').remove();
        addLog('🏆 แอดมินได้รีเซ็ตสถิติ Leaderboard เริ่มต้นซีซั่นใหม่แล้ว', 'setting');
        alert('ล้างสถิติ Leaderboard เรียบร้อยแล้ว!');
      };

      const handleUploadThemeImage = async (e, type) => {
        if (!isAdmin) return;
        const file = e.target.files[0];
        if (!file) return;
        setUploadingImg(true);
        try {
          const maxWidth = type === 'logo' ? 450 : 1400;
          const base64 = await compressImageToBase64(file, maxWidth, 0.8);
          await db.ref('theme').update({ [type]: base64 });
          addLog(`🖼️ อัปเดตรูปภาพ ${type === 'logo' ? 'โลโก้แก๊ง' : 'พื้นหลังเว็บ'} ฝังลงเซิร์ฟเวอร์แล้ว`, 'setting');
        } catch (err) {
          alert('เกิดข้อผิดพลาดในการฝังรูป');
        }
        setUploadingImg(false);
      };

      const sPercent = stock.schofield > 0 ? Math.min(100, Math.round((sRemain / stock.schofield) * 100)) : 0;
      const dPercent = stock.double > 0 ? Math.min(100, Math.round((dRemain / stock.double) * 100)) : 0;
      const totalGunsAll = stock.schofield + stock.double;
      const totalGunsRemain = sRemain + dRemain;
      const totalReadyPercent = totalGunsAll > 0 ? Math.round((totalGunsRemain / totalGunsAll) * 100) : 0;

      const activeMembers = members.filter(m => (Number(m.schofield) || 0) + (Number(m.double) || 0) > 0);
      const activeHoldersCount = activeMembers.length;

      const handleAddMember = (e) => {
        e.preventDefault();
        const trimmed = nameInput.trim();
        if (!trimmed) return;
        if (sCountInput === 0 && dCountInput === 0) {
          alert('กรุณาเลือกจำนวนปืนอย่างน้อย 1 กระบอก!');
          return;
        }
        if (sCountInput > sRemain || dCountInput > dRemain) {
          alert('จำนวนปืนที่เบิกเกินยอดที่มีอยู่ในคลัง!');
          return;
        }

        const nextS = Math.max(0, sRemain - sCountInput);
        const nextD = Math.max(0, dRemain - dCountInput);

        const existing = members.find(m => m.name.toLowerCase() === trimmed.toLowerCase());
        if (existing) {
          db.ref(`members/${existing.id}`).update({
            schofield: (Number(existing.schofield) || 0) + sCountInput,
            double: (Number(existing.double) || 0) + dCountInput,
            time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
          });
          addLog(`เพิ่มปืนให้ "${trimmed}" (+สกอฟิล ${sCountInput}, +ดับเบิ้ล ${dCountInput})`, 'add', nextS, nextD);
        } else {
          db.ref('members').push({
            name: trimmed,
            schofield: sCountInput,
            double: dCountInput,
            time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
          });
          addLog(`เบิกปืนให้ "${trimmed}" (สกอฟิล ${sCountInput}, ดับเบิ้ล ${dCountInput})`, 'add', nextS, nextD);
        }

        recordStat(trimmed, sCountInput, dCountInput);
        setNameInput('');
        setSCountInput(1);
        setDCountInput(0);
      };

      const updateGun = (id, type, delta) => {
        const target = members.find(m => m.id === id);
        if (!target) return;
        const current = Number(target[type]) || 0;
        if (delta > 0) {
          if (type === 'schofield' && sRemain <= 0) return;
          if (type === 'double' && dRemain <= 0) return;
        }
        const next = Math.max(0, current + delta);
        const otherType = type === 'schofield' ? 'double' : 'schofield';
        const otherCount = Number(target[otherType]) || 0;

        const nextS = type === 'schofield' ? Math.max(0, sRemain - delta) : sRemain;
        const nextD = type === 'double' ? Math.max(0, dRemain - delta) : dRemain;

        const gunName = type === 'schofield' ? 'สกอฟิล' : 'ดับเบิ้ล';

        if (next === 0 && otherCount === 0) {
          addLog(`คืน ${gunName} ของ "${target.name}" ครบทั้งหมดแล้ว (เคลียร์รายชื่อออกจากคลัง)`, 'return', nextS, nextD);
          db.ref(`members/${id}`).remove();
        } else {
          db.ref(`members/${id}`).update({ [type]: next });
          addLog(`ปรับ ${gunName} ของ "${target.name}" เป็น ${next} (${delta > 0 ? '+1 เบิกเพิ่ม' : '-1 คืนคลัง'})`, delta > 0 ? 'add' : 'return', nextS, nextD);
        }

        if (delta > 0) {
          recordStat(target.name, type === 'schofield' ? 1 : 0, type === 'double' ? 1 : 0);
        }
      };

      const removeMember = (id) => {
        const target = members.find(m => m.id === id);
        if (!target) return;

        const confirmDelete = window.confirm(`ยืนยันลบ "${target.name}" ออกจากระบบ? (ประวัติจะบันทึกชื่อ Discord ทันที)`);
        if (!confirmDelete) return;

        const nextS = Math.min(stock.schofield, sRemain + (Number(target.schofield) || 0));
        const nextD = Math.min(stock.double, dRemain + (Number(target.double) || 0));

        const gunDetails = `(ตอนลบถือ: สกอฟิล ${target.schofield || 0}, ดับเบิ้ล ${target.double || 0})`;
        addLog(`🚨 ได้ลบ "${target.name}" ออกจากระบบ! ${gunDetails}`, 'delete', nextS, nextD);
        db.ref(`members/${id}`).remove();
      };

      const handleSaveStock = (e) => {
        e.preventDefault();
        if (!isAdmin) return;
        db.ref('stock').set({
          schofield: Number(newSStock) || 0,
          double: Number(newDStock) || 0
        });
        db.ref('theme').update({
          webhookUrl: webhookInput.trim()
        });
        addLog(`⚙️ บันทึกตั้งค่าคลัง (สกอฟิล ${newSStock}, ดับเบิ้ล ${newDStock})`, 'setting');
        setIsSettingOpen(false);
      };

      const copySummary = () => {
        let text = `📜 คลังแสงแก๊ง 10 บัญญัติ\n`;
        text += `🔫 สกอฟิล: เหลือ ${sRemain}/${stock.schofield}\n`;
        text += `💥 ดับเบิ้ล: เหลือ ${dRemain}/${stock.double}\n\n`;
        text += `📋 รายชื่อสมาชิกที่ถือปืน:\n`;
        if (activeMembers.length === 0) {
          text += `- คลังครบ ปืนอยู่ในตู้ทั้งหมด\n`;
        } else {
          activeMembers.forEach(m => {
            const guns = [];
            if (m.schofield > 0) guns.push(`สกอฟิล ${m.schofield}`);
            if (m.double > 0) guns.push(`ดับเบิ้ล ${m.double}`);
            text += `• ${m.name}: ${guns.join(', ')}\n`;
          });
        }
        navigator.clipboard.writeText(text);
        setCopyAlert(true);
        setTimeout(() => setCopyAlert(false), 2000);
      };

      const bgStyle = themeImages.bg
        ? {
            backgroundImage: `linear-gradient(to bottom, rgba(5, 5, 5, 0.35) 0%, rgba(10, 5, 5, 0.65) 55%, rgba(5, 5, 5, 0.85) 100%), url(${themeImages.bg})`,
            backgroundSize: 'cover',
            backgroundPosition: 'center top',
            backgroundAttachment: 'fixed'
          }
        : {
            backgroundImage: `radial-gradient(circle at 30% 20%, rgba(120, 15, 15, 0.35), rgba(5, 5, 5, 0.98))`
          };

      if (!currentUser) {
        return (
          <div style={bgStyle} className="min-h-screen flex items-center justify-center p-4">
            <div className="glass-panel-red p-8 rounded-3xl max-w-md w-full text-center space-y-6">
              {themeImages.logo ? (
                <img src={themeImages.logo} alt="10 บัญญัติ" className="w-36 h-36 mx-auto rounded-full object-cover border-2 border-zinc-300 shadow-[0_0_30px_rgba(220,38,38,0.7)]" />
              ) : (
                <div className="w-24 h-24 mx-auto rounded-full bg-red-950/60 border-2 border-red-600 flex items-center justify-center text-4xl shadow-[0_0_30px_rgba(220,38,38,0.6)]">
                  📜
                </div>
              )}
              <div>
                <h1 className="text-4xl font-extrabold text-red-500 text-glow-red tracking-wide">แก๊ง 10 บัญญัติ</h1>
                <p className="text-xs text-zinc-200 mt-2 tracking-widest uppercase text-shadow-hard">THE 10 COMMANDMENTS • คลังแสงอาวุธแก๊ง</p>
                <p className="text-xs text-zinc-300 mt-4 text-shadow-hard">กรุณายืนยันตัวตนผ่าน Discord ก่อนเบิกหรือตรวจสอบคลัง</p>
              </div>
              <button
                onClick={loginWithDiscord}
                className="w-full flex items-center justify-center gap-3 bg-[#5865F2] hover:bg-[#4752C4] text-white font-bold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg"
                style={{ backgroundColor: '#5865F2' }}
              >
                เข้าสู่ระบบด้วย Discord
              </button>
            </div>
          </div>
        );
      }

      const leaderboardData = Object.values(stats).sort((a, b) => {
        const totalA = (a.totalSchofield || 0) + (a.totalDouble || 0);
        const totalB = (b.totalSchofield || 0) + (b.totalDouble || 0);
        return totalB - totalA;
      });

      const filteredMembers = activeMembers.filter(m =>
        !memberSearch.trim() || m.name.toLowerCase().includes(memberSearch.toLowerCase())
      );

      const filteredLogs = logs.filter(log => {
        const matchesType = logFilterType === 'all' || log.type === logFilterType;
        const matchesSearch = !logSearch.trim() || 
          (log.text && log.text.toLowerCase().includes(logSearch.toLowerCase())) ||
          (log.actor && log.actor.toLowerCase().includes(logSearch.toLowerCase()));
        return matchesType && matchesSearch;
      });

      return (
        <div style={bgStyle} className="min-h-screen p-4 sm:p-6 lg:px-10 lg:py-7">
          <div className="max-w-7xl mx-auto space-y-6" style={{ maxWidth: '1440px' }}>
            
            {isAdmin && (!themeImages.logo || !themeImages.bg) && (
              <div className="bg-amber-950/85 backdrop-blur-md border border-amber-500 p-3 rounded-xl flex flex-wrap items-center justify-between gap-2 text-xs">
                <span>💡 <b>สิทธิ์แอดมิน (ปอนด์):</b> กดปุ่ม <b>"⚙️ ตั้งค่าคลัง"</b> เพื่อเลือกไฟล์รูปโลโก้และพื้นหลังฝังลงเซิร์ฟเวอร์ให้ทุกคนเห็นได้เลย</span>
                <button onClick={() => setIsSettingOpen(true)} className="bg-amber-500 text-black font-bold px-3 py-1 rounded-lg">กดฝังรูปตรงนี้</button>
              </div>
            )}

            {/* HEADER */}
            <header className="glass-panel px-6 py-4 rounded-3xl flex flex-col lg:flex-row justify-between items-center gap-5">
              <div className="flex flex-col sm:flex-row items-center gap-5 text-center sm:text-left">
                {themeImages.logo ? (
                  <img 
                    src={themeImages.logo} 
                    alt="โลโก้ 10 บัญญัติ" 
                    className="w-24 h-24 sm:w-28 sm:h-28 rounded-full object-cover border-2 border-red-500/80 shadow-[0_0_30px_rgba(220,38,38,0.6)] flex-shrink-0"
                    style={{ width: '104px', height: '104px' }}
                  />
                ) : (
                  <div 
                    onClick={() => isAdmin && setIsSettingOpen(true)}
                    className={`w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-black/50 backdrop-blur border-2 border-red-500/60 flex flex-col items-center justify-center text-center p-2 flex-shrink-0 ${isAdmin ? 'border-dashed cursor-pointer hover:border-red-400' : ''}`}
                    style={{ width: '104px', height: '104px' }}
                  >
                    <span className="text-3xl">📜</span>
                    {isAdmin && <span className="text-xs text-zinc-300 mt-1">คลิกเพื่อฝังโลโก้</span>}
                  </div>
                )}
                <div>
                  <div className="inline-flex items-center gap-2 bg-red-950/80 border border-red-500/40 px-2.5 py-0.5 rounded-full text-xs text-red-300 font-semibold mb-1.5">
                    <span className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> ระบบคลังอาวุธออนไลน์
                  </div>
                  <h1 className="text-3xl sm:text-5xl font-extrabold text-red-500 text-glow-red tracking-tight">
                    แก๊ง 10 บัญญัติ
                  </h1>
                  <p className="text-xs sm:text-sm text-zinc-200 font-medium tracking-widest mt-1 text-shadow-hard">
                    THE 10 COMMANDMENTS • ARMORY TRACKER
                  </p>
                </div>
              </div>

              {/* ปุ่มควบคุมมุมขวาบน */}
              <div className="flex flex-wrap items-center justify-center gap-3">
                <div className="bg-black/50 border border-white/15 px-3.5 py-2.5 rounded-xl flex items-center gap-2.5">
                  <img src={currentUser.avatar} alt="avatar" className="w-7 h-7 rounded-full border border-indigo-400" style={{ width: '28px', height: '28px' }} />
                  <span className="text-xs font-semibold text-white text-shadow-hard">{currentUser.username}</span>
                  {isAdmin && <span className="text-xs bg-red-800 text-red-100 px-2 py-0.5 rounded border border-red-400/50 font-bold">ADMIN</span>}
                  <button onClick={logout} className="text-xs text-red-400 hover:text-red-300 ml-1.5 font-semibold">ออก</button>
                </div>

                {isAdmin && (
                  <button
                    onClick={() => setIsSettingOpen(true)}
                    className="bg-yellow-600/25 hover:bg-yellow-600/40 text-yellow-200 px-4 py-2.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 border border-yellow-400/50 text-shadow-hard"
                  >
                    ⚙️ ตั้งค่าคลัง
                  </button>
                )}

                <button
                  onClick={copySummary}
                  className="bg-red-700 hover:bg-red-600 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition shadow-lg border border-red-400/60"
                  style={{ backgroundColor: '#b91c1c' }}
                >
                  {copyAlert ? '✓ คัดลอกสรุปแล้ว!' : '📋 คัดลอกสรุปส่งดิส'}
                </button>
              </div>
            </header>

            {/* MAIN GRID LAYOUT */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              
              {/* ฝั่งซ้าย (7 คอลัมน์) */}
              <div className="lg:col-span-7 space-y-6">
                
                {/* การ์ดยอดปืนคงเหลือ + หลอดพลัง */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {/* สกอฟิล */}
                  <div className="glass-panel p-5 rounded-2xl space-y-3 relative overflow-hidden">
                    <div className="flex justify-between items-start">
                      <div>
                        <div className="text-xs text-yellow-300 font-bold tracking-wider uppercase">SCHOFIELD REVOLVER</div>
                        <div className="text-base text-white font-bold mt-0.5 text-shadow-hard">🔫 สกอฟิล (Schofield)</div>
                      </div>
                      <span className={`text-xs font-bold px-2.5 py-0.5 rounded-full border ${sRemain === 0 ? 'bg-red-900 text-red-200 border-red-500' : 'bg-green-900 text-green-200 border-green-500'}`}>
                        {sRemain === 0 ? 'หมดคลัง' : `เหลือ ${sPercent}%`}
                      </span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-5xl font-extrabold text-white text-shadow-hard">{sRemain}</span>
                      <span className="text-sm text-zinc-300 font-medium">/ {stock.schofield} กระบอก</span>
                    </div>
                    <div className="w-full h-2.5 bg-black/60 rounded-full overflow-hidden border border-white/10" style={{ height: '10px', backgroundColor: 'rgba(0,0,0,0.6)' }}>
                      <div 
                        className="h-full transition-all duration-500 rounded-full"
                        style={{ width: `${sPercent}%`, height: '100%', backgroundColor: sPercent > 30 ? '#f59e0b' : '#ef4444' }}
                      ></div>
                    </div>
                  </div>

                  {/* ดับเบิ้ล */}
                  <div className="glass-panel p-5 rounded-2xl space-y-3 relative overflow-hidden">
                    <div className="flex justify-between items-start">
                      <div>
                        <div className="text-xs text-red-400 font-bold tracking-wider uppercase">DOUBLE-ACTION REVOLVER</div>
                        <div className="text-base text-white font-bold mt-0.5 text-shadow-hard">💥 ดับเบิ้ล (Double-Action)</div>
                      </div>
                      <span className={`text-xs font-bold px-2.5 py-0.5 rounded-full border ${dRemain === 0 ? 'bg-red-900 text-red-200 border-red-500' : 'bg-green-900 text-green-200 border-green-500'}`}>
                        {dRemain === 0 ? 'หมดคลัง' : `เหลือ ${dPercent}%`}
                      </span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-5xl font-extrabold text-white text-shadow-hard">{dRemain}</span>
                      <span className="text-sm text-zinc-300 font-medium">/ {stock.double} กระบอก</span>
                    </div>
                    <div className="w-full h-2.5 bg-black/60 rounded-full overflow-hidden border border-white/10" style={{ height: '10px', backgroundColor: 'rgba(0,0,0,0.6)' }}>
                      <div 
                        className="h-full transition-all duration-500 rounded-full"
                        style={{ width: `${dPercent}%`, height: '100%', backgroundColor: '#ef4444' }}
                      ></div>
                    </div>
                  </div>
                </div>

                {/* กล่องฟอร์มเบิก + รายชื่อคนถือปืน */}
                <div className="glass-panel-red p-6 rounded-2xl space-y-6">
                  <form onSubmit={handleAddMember} className="space-y-4">
                    <div className="flex items-center justify-between">
                      <h2 className="text-base font-bold text-white flex items-center gap-2 text-shadow-hard">
                        <span className="w-2.5 h-2.5 rounded-full bg-red-500"></span>
                        ฟอร์มบันทึกเบิกอาวุธเข้าตัว
                      </h2>
                      <span className="text-xs text-zinc-300">ระบุชื่อในเกมและจำนวนปืน</span>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-12 gap-3">
                      <div className="md:col-span-6">
                        <input
                          type="text"
                          placeholder="พิมพ์ชื่อคนเบิกอาวุธ..."
                          value={nameInput}
                          onChange={e => setNameInput(e.target.value)}
                          className="w-full bg-black/55 border border-white/20 focus:border-red-500 px-4 py-2.5 rounded-xl text-sm text-white placeholder-zinc-400 outline-none transition"
                        />
                      </div>

                      <div className="md:col-span-3 flex items-center justify-between bg-black/55 border border-white/20 px-3 py-2 rounded-xl">
                        <span className="text-xs text-yellow-300 font-semibold">สกอฟิล:</span>
                        <div className="flex items-center gap-1.5">
                          <button type="button" onClick={() => setSCountInput(Math.max(0, sCountInput - 1))} className="w-6 h-6 rounded bg-white/10 hover:bg-white/20 text-xs font-bold">-</button>
                          <span className="w-5 text-center font-bold text-sm text-white">{sCountInput}</span>
                          <button type="button" onClick={() => setSCountInput(Math.min(sRemain, sCountInput + 1))} className="w-6 h-6 rounded bg-white/10 hover:bg-white/20 text-xs font-bold">+</button>
                        </div>
                      </div>

                      <div className="md:col-span-3 flex items-center justify-between bg-black/55 border border-white/20 px-3 py-2 rounded-xl">
                        <span className="text-xs text-red-300 font-semibold">ดับเบิ้ล:</span>
                        <div className="flex items-center gap-1.5">
                          <button type="button" onClick={() => setDCountInput(Math.max(0, dCountInput - 1))} className="w-6 h-6 rounded bg-white/10 hover:bg-white/20 text-xs font-bold">-</button>
                          <span className="w-5 text-center font-bold text-sm text-white">{dCountInput}</span>
                          <button type="button" onClick={() => setDCountInput(Math.min(dRemain, dCountInput + 1))} className="w-6 h-6 rounded bg-white/10 hover:bg-white/20 text-xs font-bold">+</button>
                        </div>
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full bg-red-700 hover:bg-red-600 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg border border-red-400/50"
                      style={{ backgroundColor: '#b91c1c' }}
                    >
                      + ยืนยันบันทึกเบิกอาวุธ
                    </button>
                  </form>

                  {/* รายชื่อสมาชิกที่ถือปืน */}
                  <div className="border-t border-white/15 pt-5 space-y-3.5">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                      <span className="text-sm font-bold text-white text-shadow-hard">
                        📋 รายชื่อสมาชิกแก๊งที่ถือปืน ({filteredMembers.length} คน)
                      </span>
                      <input
                        type="text"
                        placeholder="🔍 ค้นหาชื่อคนถือปืน..."
                        value={memberSearch}
                        onChange={e => setMemberSearch(e.target.value)}
                        className="bg-black/50 border border-white/15 focus:border-red-400 px-3 py-1.5 rounded-lg text-xs text-white placeholder-zinc-400 outline-none w-full sm:w-52"
                      />
                    </div>

                    {filteredMembers.length === 0 ? (
                      <div className="p-8 text-center text-zinc-300 text-xs bg-black/30 rounded-xl border border-white/5">
                        {activeMembers.length === 0 ? 'ยังไม่มีใครถือปืน อาวุธครบอยู่ในคลังทั้งหมด' : 'ไม่พบชื่อสมาชิกที่ค้นหา'}
                      </div>
                    ) : (
                      <div className="space-y-2.5 max-h-96 overflow-y-auto pr-1">
                        {filteredMembers.map(m => {
                          const totalHold = (Number(m.schofield) || 0) + (Number(m.double) || 0);
                          return (
                            <div key={m.id} className="glass-item p-3.5 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                              <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-xl bg-red-900/80 border border-red-500/40 flex items-center justify-center font-extrabold text-sm text-red-200 flex-shrink-0">
                                  {m.name.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                  <div className="flex items-center gap-2">
                                    <span className="font-bold text-white text-sm text-shadow-hard">{m.name}</span>
                                    <span className="text-xs bg-white/10 text-zinc-200 px-2 py-0.5 rounded-md font-medium">
                                      ถือรวม {totalHold} กระบอก
                                    </span>
                                  </div>
                                  <div className="text-xs text-zinc-300 mt-0.5">เบิกล่าสุดเมื่อ {m.time} น.</div>
                                </div>
                              </div>

                              <div className="flex items-center gap-2 self-end sm:self-center">
                                <div className="flex items-center gap-1.5 bg-black/55 border border-white/15 px-2.5 py-1.5 rounded-lg">
                                  <span className="text-xs text-yellow-300 font-semibold">สกอฟิล</span>
                                  <button onClick={() => updateGun(m.id, 'schofield', -1)} className="w-6 h-6 rounded bg-white/10 hover:bg-red-600 text-xs font-bold transition">-</button>
                                  <span className="w-5 text-center text-xs font-bold text-white">{m.schofield || 0}</span>
                                  <button onClick={() => updateGun(m.id, 'schofield', 1)} disabled={sRemain <= 0} className="w-6 h-6 rounded bg-white/10 hover:bg-green-600 disabled:opacity-30 text-xs font-bold transition">+</button>
                                </div>

                                <div className="flex items-center gap-1.5 bg-black/55 border border-white/15 px-2.5 py-1.5 rounded-lg">
                                  <span className="text-xs text-red-300 font-semibold">ดับเบิ้ล</span>
                                  <button onClick={() => updateGun(m.id, 'double', -1)} className="w-6 h-6 rounded bg-white/10 hover:bg-red-600 text-xs font-bold transition">-</button>
                                  <span className="w-5 text-center text-xs font-bold text-white">{m.double || 0}</span>
                                  <button onClick={() => updateGun(m.id, 'double', 1)} disabled={dRemain <= 0} className="w-6 h-6 rounded bg-white/10 hover:bg-green-600 disabled:opacity-30 text-xs font-bold transition">+</button>
                                </div>

                                <button
                                  onClick={() => removeMember(m.id)}
                                  className="bg-red-700 hover:bg-red-500 text-white p-2 rounded-lg text-xs transition shadow"
                                  style={{ backgroundColor: '#b91c1c' }}
                                  title="ลบรายชื่อออกจากระบบ"
                                >
                                  🗑️
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>
              </div>

              {/* ฝั่งขวา (5 คอลัมน์) */}
              <div className="lg:col-span-5 space-y-6">
                
                {/* การ์ดสรุปสถานะภาพรวม 3 ช่อง */}
                <div className="grid grid-cols-3 gap-3">
                  <div className="glass-panel p-3.5 rounded-2xl text-center">
                    <div className="text-xs text-zinc-300">ถูกเบิกออกนอกคลัง</div>
                    <div className="text-2xl font-extrabold text-yellow-400 mt-1 text-shadow-hard">{totalSUsed + totalDUsed} <span className="text-xs font-normal text-zinc-300">กระบอก</span></div>
                  </div>
                  <div className="glass-panel p-3.5 rounded-2xl text-center">
                    <div className="text-xs text-zinc-300">กำลังถือปืนอยู่</div>
                    <div className="text-2xl font-extrabold text-white mt-1 text-shadow-hard">{activeHoldersCount} <span className="text-xs font-normal text-zinc-300">คน</span></div>
                  </div>
                  <div className="glass-panel p-3.5 rounded-2xl text-center">
                    <div className="text-xs text-zinc-300">ความพร้อมคลัง</div>
                    <div className={`text-2xl font-extrabold mt-1 text-shadow-hard ${totalReadyPercent > 50 ? 'text-green-400' : 'text-red-400'}`}>{totalReadyPercent}%</div>
                  </div>
                </div>

                {/* อันดับมือปืนแก๊ง */}
                <div className="glass-panel p-5 rounded-2xl space-y-3.5">
                  <div className="flex items-center justify-between border-b border-white/15 pb-3">
                    <h3 className="text-sm font-bold text-white flex items-center gap-2 text-shadow-hard">
                      🏆 อันดับมือปืนแก๊ง (Leaderboard)
                    </h3>
                    <span className="text-xs text-zinc-300">ยอดเบิกสะสมทั้งหมด</span>
                  </div>
                  {leaderboardData.length === 0 ? (
                    <div className="p-6 text-center text-zinc-300 text-xs">ยังไม่มีสถิติการเบิกปืน</div>
                  ) : (
                    <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                      {leaderboardData.slice(0, 6).map((item, idx) => {
                        const total = (item.totalSchofield || 0) + (item.totalDouble || 0);
                        const medal = idx === 0 ? '👑' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
                        let rankStyle = "bg-black/40 border-white/10";
                        if (idx === 0) rankStyle = "bg-yellow-900/40 border-yellow-400/60";
                        if (idx === 1) rankStyle = "bg-zinc-800/50 border-zinc-300/40";
                        if (idx === 2) rankStyle = "bg-red-950/40 border-orange-400/40";

                        return (
                          <div key={idx} className={`flex items-center justify-between text-xs py-2.5 px-3 rounded-xl border transition ${rankStyle}`}>
                            <div className="flex items-center gap-2.5">
                              <span className="w-6 text-center font-extrabold text-sm text-yellow-300 text-shadow-hard">{medal}</span>
                              <span className="font-bold text-white text-shadow-hard">{item.name}</span>
                            </div>
                            <div className="text-zinc-200 text-shadow-hard">
                              สกอฟิล {item.totalSchofield || 0} • ดับเบิ้ล {item.totalDouble || 0} <span className="text-yellow-300 font-extrabold ml-1.5">({total})</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>

                {/* บันทึกกิจกรรมสด */}
                <div className="glass-panel p-5 rounded-2xl space-y-3.5">
                  <div className="flex items-center justify-between border-b border-white/15 pb-3">
                    <h3 className="text-sm font-bold text-white flex items-center gap-2 text-shadow-hard">
                      📜 บันทึกกิจกรรมสด 
                    </h3>
                    <button
                      onClick={() => setIsFullLogOpen(true)}
                      className="bg-red-700 hover:bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg border border-red-400/50 transition"
                      style={{ backgroundColor: '#b91c1c' }}
                    >
                      🔍 เช็ค Log ย้อนหลัง ({logs.length})
                    </button>
                  </div>

                  {logs.length === 0 ? (
                    <div className="p-6 text-center text-zinc-300 text-xs">ยังไม่มีประวัติกิจกรรม</div>
                  ) : (
                    <div className="space-y-2.5 max-h-80 overflow-y-auto pr-1">
                      {logs.slice(0, 10).map(log => {
                        let leftBar = "border-l-4 border-l-zinc-500";
                        if (log.type === 'add') leftBar = "border-l-4 border-l-green-500";
                        if (log.type === 'return') leftBar = "border-l-4 border-l-yellow-500";
                        if (log.type === 'delete') leftBar = "border-l-4 border-l-red-500 bg-red-950/35";

                        return (
                          <div key={log.id} className={`glass-item flex items-center justify-between gap-2.5 p-2.5 rounded-xl text-xs ${leftBar}`}>
                            <div className="flex items-center gap-2.5 overflow-hidden">
                              {log.avatar ? (
                                <img src={log.avatar} alt="" className="w-7 h-7 rounded-full flex-shrink-0 border border-indigo-400/60" style={{ width: '28px', height: '28px' }} />
                              ) : (
                                <div className="w-7 h-7 rounded-full bg-indigo-600 flex-shrink-0 flex items-center justify-center text-xs">👤</div>
                              )}
                              <div className="overflow-hidden">
                                <div className={`font-semibold truncate text-shadow-hard ${log.type === 'delete' ? 'text-red-300' : 'text-white'}`}>
                                  <span className="text-yellow-300">[{log.actor}]</span> {log.text}
                                </div>
                                <div className="text-xs text-zinc-300">{log.time}</div>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  <button
                    onClick={() => setIsFullLogOpen(true)}
                    className="w-full bg-black/50 hover:bg-white/10 text-zinc-100 text-xs font-semibold py-2.5 rounded-xl border border-white/20 transition text-shadow-hard"
                  >
                    📂 เปิดหน้าต่างไล่ดูประวัติ Log เก่าๆ ทั้งหมด
                  </button>
                </div>

              </div>
            </div>
          </div>

          {/* MODAL 1: หน้าต่างเช็คประวัติ Log ย้อนหลังทั้งหมด */}
          {isFullLogOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="glass-panel-red bg-zinc-950/90 rounded-3xl max-w-3xl w-full p-6 space-y-4 max-h-screen flex flex-col" style={{ maxHeight: '90vh' }}>
                <div className="flex justify-between items-center border-b border-white/15 pb-3">
                  <div>
                    <h3 className="font-bold text-lg text-red-400 flex items-center gap-2">
                      📜 ประวัติ Log ย้อนหลังทั้งหมด ({filteredLogs.length} รายการ)
                    </h3>
                    <p className="text-xs text-zinc-300">ค้นหาชื่อคนเบิก คนกดลบ หรือเลือกดูเฉพาะรายการที่ต้องการ</p>
                  </div>
                  <button onClick={() => setIsFullLogOpen(false)} className="text-zinc-300 hover:text-white text-xl font-bold px-2">✕</button>
                </div>

                <div className="flex flex-col sm:flex-row gap-2">
                  <input
                    type="text"
                    placeholder="🔍 พิมพ์ค้นหาชื่อคนเบิก, ชื่อ Discord หรือเวลา..."
                    value={logSearch}
                    onChange={e => setLogSearch(e.target.value)}
                    className="flex-1 bg-black/60 border border-white/20 focus:border-red-500 px-3.5 py-2 rounded-xl text-xs text-white outline-none"
                  />
                  <div className="flex gap-1.5 flex-wrap">
                    <button
                      onClick={() => setLogFilterType('all')}
                      className={`px-3 py-2 rounded-xl text-xs font-bold ${logFilterType === 'all' ? 'bg-red-700 text-white' : 'bg-white/10 text-zinc-300'}`}
                    >ทั้งหมด</button>
                    <button
                      onClick={() => setLogFilterType('add')}
                      className={`px-3 py-2 rounded-xl text-xs font-bold ${logFilterType === 'add' ? 'bg-green-700 text-white' : 'bg-white/10 text-zinc-300'}`}
                    >เบิกปืน</button>
                    <button
                      onClick={() => setLogFilterType('return')}
                      className={`px-3 py-2 rounded-xl text-xs font-bold ${logFilterType === 'return' ? 'bg-yellow-700 text-white' : 'bg-white/10 text-zinc-300'}`}
                    >คืนปืน</button>
                    <button
                      onClick={() => setLogFilterType('delete')}
                      className={`px-3 py-2 rounded-xl text-xs font-bold ${logFilterType === 'delete' ? 'bg-red-800 text-white' : 'bg-white/10 text-zinc-300'}`}
                    >🚨 ลบข้อมูล</button>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                  {filteredLogs.length === 0 ? (
                    <div className="p-10 text-center text-zinc-400 text-sm">ไม่พบรายการที่ค้นหา</div>
                  ) : (
                    filteredLogs.map(log => {
                      let borderStyle = "border-white/15 bg-black/45";
                      if (log.type === 'delete') borderStyle = "border-red-500 bg-red-950/45";
                      if (log.type === 'add') borderStyle = "border-green-700 bg-green-950/30";
                      if (log.type === 'return') borderStyle = "border-yellow-700 bg-yellow-950/30";

                      return (
                        <div key={log.id} className={`p-3 rounded-xl border flex items-center justify-between gap-3 text-xs ${borderStyle}`}>
                          <div className="flex items-center gap-3">
                            {log.avatar ? (
                              <img src={log.avatar} alt="" className="w-7 h-7 rounded-full flex-shrink-0 border border-red-500/50" style={{ width: '28px', height: '28px' }} />
                            ) : (
                              <div className="w-7 h-7 rounded-full bg-zinc-700 flex-shrink-0"></div>
                            )}
                            <div>
                              <span className="font-bold text-yellow-300 mr-2">[{log.actor}]</span>
                              <span className={log.type === 'delete' ? 'text-red-300 font-bold' : 'text-zinc-100'}>{log.text}</span>
                            </div>
                          </div>
                          <span className="text-xs text-zinc-300 flex-shrink-0 font-mono">{log.time}</span>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL 2: ตั้งค่าคลังปืน & Discord Webhook & รีเซ็ตสถิติ (เฉพาะปอนด์คนเดียว) */}
          {isAdmin && isSettingOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="glass-panel-red bg-zinc-950/95 rounded-3xl max-w-md w-full p-6 space-y-5 max-h-screen overflow-y-auto" style={{ maxHeight: '92vh' }}>
                <div className="flex justify-between items-center border-b border-white/15 pb-3">
                  <h3 className="font-bold text-base text-red-400">⚙️ ตั้งค่าคลัง & ระบบแจ้งเตือน (เฉพาะแอดมิน)</h3>
                  <button onClick={() => setIsSettingOpen(false)} className="text-zinc-300 hover:text-white">✕</button>
                </div>

                <div className="space-y-3 bg-black/50 p-4 rounded-2xl border border-white/15">
                  <div className="text-xs font-bold text-yellow-400">🖼️ ฝังรูปลงเว็บถาวร (ทุกคนเห็นเหมือนกันหมด)</div>
                  {uploadingImg && <div className="text-xs text-green-400 animate-pulse">กำลังฝังรูปลงเซิร์ฟเวอร์...</div>}
                  <div>
                    <label className="text-xs text-zinc-200 block mb-1">1. รูปโลโก้แก๊ง 10 บัญญัติ (วงกลมซ้ายบน):</label>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={(e) => handleUploadThemeImage(e, 'logo')}
                      className="w-full text-xs text-zinc-300"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-zinc-200 block mb-1">2. รูปพื้นหลังแก๊งพระจันทร์สีเลือด:</label>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={(e) => handleUploadThemeImage(e, 'bg')}
                      className="w-full text-xs text-zinc-300"
                    />
                  </div>
                </div>

                <form onSubmit={handleSaveStock} className="space-y-4">
                  <div className="space-y-2 bg-black/50 p-4 rounded-2xl border border-white/15">
                    <div className="text-xs font-bold text-zinc-200">🔫 ปรับจำนวนปืนสูงสุดในคลัง</div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs text-zinc-300 block mb-1">สกอฟิลทั้งหมด:</label>
                        <input
                          type="number"
                          min="1"
                          value={newSStock}
                          onChange={e => setNewSStock(e.target.value)}
                          className="w-full bg-black/60 border border-white/20 px-3 py-2 rounded-xl text-yellow-400 font-bold outline-none"
                        />
                      </div>
                      <div>
                        <label className="text-xs text-zinc-300 block mb-1">ดับเบิ้ลทั้งหมด:</label>
                        <input
                          type="number"
                          min="1"
                          value={newDStock}
                          onChange={e => setNewDStock(e.target.value)}
                          className="w-full bg-black/60 border border-white/20 px-3 py-2 rounded-xl text-red-400 font-bold outline-none"
                        />
                      </div>
                    </div>
                  </div>

                  {/* ตั้งค่า Discord Webhook */}
                  <div className="space-y-2 bg-black/50 p-4 rounded-2xl border border-indigo-500/40">
                    <div className="text-xs font-bold text-indigo-300">🔔 แจ้งเตือนเข้าห้องแชท Discord (Webhook URL)</div>
                    <p className="text-xs text-zinc-400">วางลิงก์ Webhook ของห้องแชทแก๊งเพื่อให้บอทแจ้งเตือนทุกครั้งที่มีคนเบิก/คืน/ลบปืน</p>
                    <input
                      type="text"
                      placeholder="https://discord.com/api/webhooks/..."
                      value={webhookInput}
                      onChange={e => setWebhookInput(e.target.value)}
                      className="w-full bg-black/60 border border-white/20 px-3 py-2 rounded-xl text-xs text-white outline-none"
                    />
                  </div>

                  {/* ปุ่มรีเซ็ต Leaderboard */}
                  <div className="bg-red-950/35 p-4 rounded-2xl border border-red-500/40 flex items-center justify-between gap-2">
                    <div>
                      <div className="text-xs font-bold text-red-300">🏆 รีเซ็ตอันดับมือปืน (เริ่มซีซั่นใหม่)</div>
                      <div className="text-xs text-zinc-400">ล้างเฉพาะคะแนน Leaderboard (ไม่กระทบยอดปืนปัจจุบัน)</div>
                    </div>
                    <button
                      type="button"
                      onClick={handleResetLeaderboard}
                      className="bg-red-800 hover:bg-red-700 text-white text-xs font-bold px-3 py-2 rounded-xl flex-shrink-0 border border-red-400/50"
                      style={{ backgroundColor: '#991b1b' }}
                    >
                      ล้างอันดับ
                    </button>
                  </div>

                  <div className="flex gap-2 justify-end pt-2">
                    <button
                      type="button"
                      onClick={() => setIsSettingOpen(false)}
                      className="px-4 py-2 rounded-xl text-xs text-zinc-300 hover:text-white"
                    >
                      ยกเลิก
                    </button>
                    <button
                      type="submit"
                      className="bg-red-700 hover:bg-red-600 text-white font-bold px-5 py-2.5 rounded-xl text-xs shadow-lg"
                      style={{ backgroundColor: '#b91c1c' }}
                    >
                      บันทึกการตั้งค่าทั้งหมด
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
